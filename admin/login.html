<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - WhatsApp Gateway</title>
    <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --brand-green: #10b981;
            --brand-green-glow: rgba(16, 185, 129, 0.25);
            --bg-app: #f8fafc;
            --bg-card: #ffffff;
            --border-card: #e2e8f0;
        }

        [data-bs-theme="dark"] {
            --bg-app: #0b0f19;
            --bg-card: #151c2c;
            --border-card: #1e293b;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-app);
            color: var(--bs-body-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
            transition: background-color 0.3s ease;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 2rem;
            position: relative;
            overflow: hidden;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon-box {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 20px var(--brand-green-glow);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: #64748b;
        }

        .form-label {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border-color: var(--border-card);
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 14px var(--brand-green-glow);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--brand-green-glow);
        }

        .theme-toggle-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            color: var(--bs-body-color);
            background: rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <button class="theme-toggle-btn" id="themeToggler" title="Toggle Theme">
                <i class="bi bi-sun-fill"></i>
            </button>

            <div class="brand-header">
                <div class="brand-icon-box">
                    <i class="bi bi-whatsapp"></i>
                </div>
                <h2 class="brand-title">WA Gateway</h2>
                <div class="brand-subtitle">Sign in to access admin control dashboard</div>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Username / Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body-tertiary border-end-0 rounded-start-3"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control border-start-0" id="email" placeholder="admin" autofocus required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-body-tertiary border-end-0 rounded-start-3"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div id="loginError" class="alert alert-danger mt-3 d-none" role="alert"></div>

            <div class="text-center mt-4">
                <small class="text-muted">WhatsApp API Server v3.2 &bull; Multi-Session</small>
            </div>
        </div>
    </div>

    <script>
        const themeToggler = document.getElementById('themeToggler');
        function initTheme() {
            const savedTheme = localStorage.getItem('app-theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            if (themeToggler) {
                themeToggler.innerHTML = savedTheme === 'dark' 
                    ? '<i class="bi bi-sun-fill text-warning"></i>' 
                    : '<i class="bi bi-moon-stars-fill text-primary"></i>';
            }
        }

        if (themeToggler) {
            themeToggler.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem('app-theme', newTheme);
                initTheme();
            });
        }
        initTheme();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('loginError');

            errDiv.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Signing in...';

            const loginData = { password };
            if (email) loginData.email = email;

            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData)
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.role) sessionStorage.setItem('userRole', data.role);
                    if (data.email) sessionStorage.setItem('userEmail', data.email);
                    window.location.href = '/admin/dashboard.html';
                } else {
                    const data = await res.json();
                    errDiv.textContent = data.message || 'Login failed. Please check your credentials.';
                    errDiv.classList.remove('d-none');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
                }
            } catch (err) {
                errDiv.textContent = 'An error occurred during login. Please try again.';
                errDiv.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
            }
        });
    </script>
</body>

</html>
